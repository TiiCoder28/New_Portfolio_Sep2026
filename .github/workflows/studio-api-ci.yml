name: Studio and API CI
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'backend/**'
      - '.github/workflows/studio-api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'backend/**'
      - '.github/workflows/studio-api-ci.yml'
permissions:
  contents: read
jobs:
  studio-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
