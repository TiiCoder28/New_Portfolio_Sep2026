name: Frontend CI
on:
  pull_request:
  push:
    branches: [main, feature/editorial-portfolio-foundation]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build portfolio
        run: npm run build
