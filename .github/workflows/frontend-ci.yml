name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and regenerate compatible lockfile
        run: npm install
      - name: Build portfolio
        run: npm run build
      - name: Save generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
